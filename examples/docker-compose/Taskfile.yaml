version: "3"

vars:
  DOCKER_COMPOSE_FILE: docker-compose.yaml

tasks:
  help:
    desc: Show available tasks
    cmds:
      - task --list

  up:
    desc: Start all services using Docker Compose
    cmds:
      - docker compose -f {{.DOCKER_COMPOSE_FILE}} up -d

  down:
    desc: Stop all services
    cmds:
      - docker compose -f {{.DOCKER_COMPOSE_FILE}} down

  restart:
    desc: Restart all services
    cmds:
      - task: down
      - task: up

  logs:
    desc: Show logs for all services
    cmds:
      - docker compose -f {{.DOCKER_COMPOSE_FILE}} logs -f

  logs-gateway:
    desc: Show logs for inference gateway
    cmds:
      - docker compose -f {{.DOCKER_COMPOSE_FILE}} logs -f inference-gateway

  logs-agent:
    desc: Show logs for calendar agent
    cmds:
      - docker compose -f {{.DOCKER_COMPOSE_FILE}} logs -f google-calendar-agent

  status:
    desc: Show status of all services
    cmds:
      - docker compose -f {{.DOCKER_COMPOSE_FILE}} ps

  health:
    desc: Check health of all services
    cmds:
      - echo "Checking Inference Gateway health..."
      - curl -sf http://localhost:8080/health || echo "Inference Gateway health check failed"
      - echo "Checking Calendar Agent health..."
      - curl -sf http://localhost:8081/health || echo "Calendar Agent health check failed"

  test-gateway:
    desc: Test Inference Gateway with a simple request
    cmds:
      - |
        curl -X POST http://localhost:8080/v1/chat/completions \
          -H "Content-Type: application/json" \
          -d '{
            "model": "deepseek/deepseek-v4-flash",
            "messages": [
              {
                "role": "user",
                "content": "Hello, can you help me with my calendar?"
              }
            ]
          }'

  test-agent:
    desc: Test Calendar Agent directly
    cmds:
      - |
        curl -s -X POST http://localhost:8081/a2a \
          -H "Content-Type: application/json" \
          -d '{
            "jsonrpc": "2.0",
            "id": 1,
            "method": "SendMessage",
            "params": {
              "message": {
                "messageId": "m-1",
                "role": "ROLE_USER",
                "parts": [{"text": "List my events for today"}]
              }
            }
          }' | jq .

  agent-info:
    desc: Get agent information
    cmds:
      - curl -s http://localhost:8081/.well-known/agent-card.json | jq

  debugger:card:
    desc: Show the agent card through the a2a-debugger
    cmds:
      - docker compose -f {{.DOCKER_COMPOSE_FILE}} run --rm a2a-debugger agent-card

  debugger:submit:
    desc: 'Submit a prompt through the a2a-debugger (usage: task debugger:submit -- "Find a free 1-hour slot on Thursday")'
    cmds:
      - docker compose -f {{.DOCKER_COMPOSE_FILE}} run --rm a2a-debugger tasks submit {{.CLI_ARGS}}

  debugger:tasks:
    desc: List tasks the agent has processed
    cmds:
      - docker compose -f {{.DOCKER_COMPOSE_FILE}} run --rm a2a-debugger tasks list

  debugger:history:
    desc: 'Show the conversation for a context (usage: task debugger:history -- <context-id>)'
    cmds:
      - docker compose -f {{.DOCKER_COMPOSE_FILE}} run --rm a2a-debugger tasks history {{.CLI_ARGS}}

  clean:
    desc: Stop services and remove volumes and networks
    cmds:
      - docker compose -f {{.DOCKER_COMPOSE_FILE}} down -v

  clean-all:
    desc: Stop services and remove volumes, networks, and images
    cmds:
      - docker compose -f {{.DOCKER_COMPOSE_FILE}} down -v --rmi all

  pull:
    desc: Pull latest images
    cmds:
      - docker compose -f {{.DOCKER_COMPOSE_FILE}} pull

  build:
    desc: Build services (if using local builds)
    cmds:
      - docker compose -f {{.DOCKER_COMPOSE_FILE}} build

  validate-env:
    desc: Validate environment configuration
    cmds:
      - |
        if [ ! -f .env ]; then
          echo "Error: .env file not found. Run 'task setup' first."
          exit 1
        fi
        echo "Environment file exists."
        if grep -q -E "^(GROQ|OPENAI|ANTHROPIC|DEEPSEEK|GOOGLE|MISTRAL|COHERE|CLOUDFLARE)_API_KEY=" .env; then
          echo "LLM provider API key found."
        else
          echo "Warning: No LLM provider API key found. Please configure at least one provider in .env"
        fi

  demo:
    desc: Start in demo mode (no Google Calendar integration required)
    cmds:
      - |
        GOOGLE_CALENDAR_MOCK_MODE=true \
        docker compose -f {{.DOCKER_COMPOSE_FILE}} up

  prod:
    desc: Start in production mode
    cmds:
      - |
        ENVIRONMENT=production \
        docker compose -f {{.DOCKER_COMPOSE_FILE}} up -d
