schema-version = "1.15.0"

[install]
adl.flake = "github:inference-gateway/adl-cli/v0.68.4"
go.pkg-path = "go"
go.version = "1.26.8"

golangci-lint.pkg-path = "golangci-lint"
golangci-lint.version = "^2.15.0"
golangci-lint.pkg-group = "common"

go-task.pkg-path = "go-task"
go-task.version = "^3.53.1"
go-task.pkg-group = "common"

git.pkg-path = "git"
git.version = "^2.56.0"
git.pkg-group = "common"

docker.pkg-path = "docker"
docker.version = "^29.9.1"
docker.pkg-group = "common"

claude-code.pkg-path = "claude-code"
claude-code.version = "^2.1.311"
claude-code.pkg-group = "common"

infer.flake = "github:inference-gateway/cli/v0.238.0"

[hook]
on-activate = '''
  echo "🌟 Welcome to google-calendar-agent development environment!"
  echo "Go version: $(go version)"
'''
